<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="bits.title">Joc Binari - 8 bits</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            max-width: 100%;
        }

        .binary-display {
            font-size: 28px;
            letter-spacing: 8px;
            margin-bottom: 15px;
        }

        .decimal-display {
            font-size: 24px;
            color: #CCCCCC;
            text-align: center;
        }

        .range-info {
            font-size: 14px;
            color: var(--bit-off);
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <nav class="topbar">
        <a class="home-link" href="index.html" data-i18n="nav.menu">← Menú</a>
        <div class="lang-switch" role="group" aria-label="Idioma / Language">
            <button type="button" data-lang="ca">CA</button>
            <button type="button" data-lang="en">EN</button>
        </div>
    </nav>

    <main class="game-container">
        <p class="instruction" data-i18n="bits.instruction">Toca els cercles per canviar els bits. Els valors posicionals apareixen quan el bit està encès.</p>

        <div class="bits-container" id="bitsContainer"></div>

        <div>
            <div class="binary-display" id="binaryDisplay">00000000</div>
            <div class="decimal-display"><span data-i18n="bits.decimal">Decimal:</span> <span id="decimalValue">0</span></div>
            <div class="range-info" data-i18n="bits.range">Rang: 0 - 255 (1 byte)</div>
        </div>
    </main>

    <script src="js/i18n.js"></script>
    <script src="js/bits.js"></script>
    <script>
        const binaryDisplay = document.getElementById('binaryDisplay');
        const decimalValue = document.getElementById('decimalValue');

        const byte = createBitRow(document.getElementById('bitsContainer'), 8, (value, binary) => {
            binaryDisplay.textContent = binary;
            decimalValue.textContent = value;
        });
    </script>
</body>
</html>
