<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="ip.title">Joc Binari - Adreça IP</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            padding-top: 30px;
        }

        .ip-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 100%;
        }

        .octet-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background-color: var(--panel-2);
            min-width: 280px;
        }

        .octet-title {
            font-size: 18px;
            color: var(--gold);
        }

        .octet-title .octet-value {
            color: var(--text);
            font-family: 'Courier New', monospace;
        }

        .octet-container .bits-container {
            --bit-gap: 6px;
            --nibble-gap: 18px;
            padding-bottom: 22px;
        }

        .octet-container .bit {
            width: 44px;
            height: 44px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        .octet-container .bit.on {
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
        }

        .octet-container .bit-value { font-size: 20px; }
        .octet-container .bit-label { bottom: -20px; font-size: 11px; }

        .result-container {
            text-align: center;
            padding: 15px;
            background-color: var(--panel-2);
            border-radius: 8px;
            border: 1px solid var(--border);
            min-width: 280px;
        }

        .ip-display-label {
            font-size: 16px;
            color: #CCCCCC;
            margin-bottom: 5px;
        }

        .ip-display {
            font-size: 28px;
            font-weight: bold;
            color: var(--gold);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            word-break: break-all;
        }

        .ip-binary {
            margin-top: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: var(--muted);
            word-break: break-all;
        }

        @media (max-width: 768px) {
            .octet-container { width: 100%; max-width: 450px; min-width: unset; }
            .octet-container .bit { width: 34px; height: 34px; }
            .octet-container .bit-value { font-size: 16px; }
            .octet-container .bit-label { font-size: 10px; bottom: -18px; }
            .octet-container .bits-container { --bit-gap: 4px; --nibble-gap: 12px; }
            .ip-display { font-size: 22px; }
            .result-container { width: 100%; max-width: 450px; min-width: unset; }
        }

        @media (max-width: 520px) {
            .octet-container .bit { width: min(34px, calc((100vw - 112px) / 8)); }
        }
    </style>
</head>
<body>
    <nav class="topbar">
        <a class="home-link" href="index.html" data-i18n="nav.menu">← Menú</a>
        <div class="lang-switch" role="group" aria-label="Idioma / Language">
            <button type="button" data-lang="ca">CA</button>
            <button type="button" data-lang="en">EN</button>
        </div>
    </nav>

    <main class="game-container">
        <p class="instruction" data-i18n="ip.instruction">Toca els cercles per canviar els bits de cada octet. Els valors posicionals apareixen quan el bit està encès. L'adreça IP resultant es mostra a sota.</p>

        <div class="ip-container" id="ipContainer"></div>

        <div class="result-container">
            <div class="ip-display-label" data-i18n="ip.result">Adreça IP resultant:</div>
            <div class="ip-display" id="ipDisplay">0.0.0.0</div>
            <div class="ip-binary" id="ipBinary">00000000.00000000.00000000.00000000</div>
        </div>
    </main>

    <script src="js/i18n.js"></script>
    <script src="js/bits.js"></script>
    <script>
        const NUM_OCTETS = 4;
        const ipContainer = document.getElementById('ipContainer');
        const ipDisplay = document.getElementById('ipDisplay');
        const ipBinary = document.getElementById('ipBinary');

        const values = new Array(NUM_OCTETS).fill(0);
        const binaries = new Array(NUM_OCTETS).fill('00000000');

        function updateIpDisplay() {
            ipDisplay.textContent = values.join('.');
            ipBinary.textContent = binaries.join('.');
        }

        for (let i = 0; i < NUM_OCTETS; i++) {
            const octet = document.createElement('section');
            octet.className = 'octet-container';

            const title = document.createElement('h3');
            title.className = 'octet-title';
            const titleName = document.createElement('span');
            const titleValue = document.createElement('span');
            titleValue.className = 'octet-value';
            titleValue.textContent = '0';
            title.append(titleName, ' ', titleValue);
            const renderTitle = () => { titleName.textContent = I18n.t('ip.octet', { n: i + 1 }); };
            renderTitle();
            I18n.onChange(renderTitle);

            const bitsDiv = document.createElement('div');
            bitsDiv.className = 'bits-container';

            octet.append(title, bitsDiv);
            ipContainer.appendChild(octet);

            createBitRow(bitsDiv, 8, (value, binary) => {
                values[i] = value;
                binaries[i] = binary;
                titleValue.textContent = value;
                updateIpDisplay();
            });
        }
    </script>
</body>
</html>
